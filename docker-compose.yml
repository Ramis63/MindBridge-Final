services:
  mindbridge:
    build: .
    container_name: mindbridge-app
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database across container restarts
      - mindbridge-data:/data
    restart: unless-stopped
    environment:
      - DB_PATH=/data/mindbridge.db
      - MINDBRIDGE_ENV=prod
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a random secret of 32+ chars (see config/prod.env.example)}
      - CORS_ORIGIN=${CORS_ORIGIN:?Set CORS_ORIGIN to your deployed origin (see config/prod.env.example)}

volumes:
  mindbridge-data:
    driver: local
